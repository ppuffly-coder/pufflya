<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Mint - Premium Lottery System</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rich Mint">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#14b8a6">
    
    <link rel="icon" type="image/png" href="https://files.catbox.moe/p9o8n8.png">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/p9o8n8.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root { 
            --primary: #14b8a6; --primary-dark: #0d9488; --bg: #f0fdfa; 
            --card-bg: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; 
            --line-green: #06C755; --pending: #f59e0b; --paid: #10b981;
            --mint-light: #a7f3d0;
            --lemon-light: #fef08a;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; overflow-x: hidden; scroll-behavior: smooth; }
        .app-container { width: 100%; max-width: 420px; padding: 15px; min-height: 100vh; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(20, 184, 166, 0.15); box-shadow: 0 8px 20px rgba(20, 184, 166, 0.05); transition: 0.3s; }
        .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 15px; background: var(--primary); color: white; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        input { width: 100%; padding: 14px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 16px; outline: none; margin-bottom: 10px; transition: 0.3s; }
        .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 15px 0; }
        .num-key { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: white; border: 1px solid #ccfbf1; border-radius: 12px; font-weight: 800; color: var(--primary-dark); cursor: pointer; }
        .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .type-btn { padding: 12px 0; background: white; border: 1.5px solid #ccfbf1; border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
        .type-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* บิลดีไซน์ มิ้นต์-เลม่อน */
        #billModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; justify-content:center; align-items:center; padding:20px; }
        .digital-bill { 
            background: linear-gradient(135deg, #a7f3d0 0%, #fef08a 100%); 
            width:100%; max-width:350px; border-radius:35px; overflow:hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            color: #065f46; padding-bottom: 25px;
        }
        .bill-header-area { padding: 30px 20px 10px; text-align: center; }
        .bill-body-card { 
            background: rgba(255, 255, 255, 0.4); 
            margin: 10px 20px; padding: 20px; border-radius: 25px; 
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .bill-col-item { display: flex; justify-content: space-between; font-size: 14px; background: rgba(255, 255, 255, 0.5); padding: 6px 10px; border-radius: 12px; margin-bottom: 4px; color: #065f46; font-weight: 700; }
        #mStatus { padding: 6px 20px; border-radius: 50px; font-size: 14px; font-weight: 800; color: white; display: inline-block; margin-bottom: 10px; }
        
        .payout-card { background: #fff; border-radius: 15px; padding: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .payout-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .payout-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #f8fafc; border-radius: 10px; font-size: 13px; }
        .winner-gold { background: linear-gradient(135deg, #ffffff 0%, #fffbeb 50%, #fef3c7 100%) !important; border: 2px solid #fbbf24 !important; }
        .btn-line-win { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--line-green); color: white; text-decoration: none; padding: 16px; border-radius: 15px; font-weight: 800; margin-top: 15px; }
        .spotify-prize-card { background: #121212; border-radius: 20px; padding: 15px; margin-bottom: 15px; border: 1px solid #282828; }
        .prize-row { display: grid; grid-template-columns: 1.2fr 1fr 0.8fr 0.8fr; gap: 5px; margin-top: 10px; }
        .prize-item { background: #181818; padding: 10px 3px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        .prize-label { color: #888; font-size: 10px; font-weight: bold; }
        .prize-val { color: #1DB954; font-size: 15px; font-weight: 900; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="billModal">
        <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
            <div class="digital-bill" id="captureArea">
                <div class="bill-header-area">
                    <h2 style="margin:0; font-size: 26px; letter-spacing: 1.5px; font-weight: 900; color: #065f46;">RICH MINT</h2>
                    <small id="mBillId" style="opacity: 0.7; font-weight: 700;">#RM-000000</small>
                </div>
                <div style="text-align:center; margin: 10px 0;"><span id="mStatus">รอชำระเงิน</span></div>
                <div class="bill-body-card">
                    <div id="mItems"></div> 
                    <div style="display:flex; justify-content:space-between; font-size:22px; font-weight:900; margin-top:10px; color: #065f46;">
                        <span>ยอดรวม</span><span id="mTotal">0 บาท</span>
                    </div>
                    <div style="margin-top:15px; font-size:11px; color: #065f46; opacity: 0.8;">
                        <div>ซื้อเมื่อ: <span id="mBuyDate">-</span></div>
                        <div style="font-weight:bold; margin-top: 4px;">งวดวันที่: <span id="mDrawDate">-</span></div>
                    </div>
                </div>
            </div>
            <div style="margin-top:20px; display:flex; gap:12px; width:100%; max-width:350px;">
                <button class="btn-primary" style="flex:1; background: #14b8a6;" onclick="window.saveBillImage()"><i class="fa-solid fa-download"></i> บันทึกภาพ</button>
                <button class="btn-primary" style="flex:1; background:#475569;" onclick="document.getElementById('billModal').style.display='none'">ปิด</button>
            </div>
        </div>
    </div>

    <div id="adminPanel" style="display:none;">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <b style="font-size:22px; color:var(--primary-dark);"><i class="fa-solid fa-user-shield"></i> ผู้ดูแลระบบ</b>
            <button onclick="location.reload()" style="border:none; background:#fee2e2; color:#ef4444; padding:8px 15px; border-radius:12px; font-weight:700;">ออก</button>
        </header>
        <div class="card">
            <b>ประกาศรางวัล (5 ไป 2)</b>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:15px 0;">
                <input type="number" id="p5" placeholder="5 ตัว"> <input type="number" id="p4" placeholder="4 ตัว">
                <input type="number" id="p3" placeholder="3 ตัว"> <input type="number" id="p2" placeholder="2 ตัว">
            </div>
            <button class="btn-primary" onclick="window.announce()">บันทึกผลรางวัล</button>
        </div>
        <div id="adminOrderStats"></div>
    </div>

    <div id="userPanel">
        <header id="appHeader" style="display:none; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div style="font-size:24px; font-weight:900; color:var(--primary);"><i class="fa-solid fa-coins"></i> Rich Mint</div>
            <button onclick="window.toggleHistory()" style="background:white; border:2px solid var(--primary); color:var(--primary); padding:8px 18px; border-radius:12px; font-weight:800;">ประวัติ</button>
        </header>
        
        <div id="officialPrizeDisplay" style="display:none;">
            <div class="spotify-prize-card">
                <div style="color:#1DB954; font-size:11px; font-weight:bold;">● LIVE ผลรางวัล</div>
                <div id="prizeNumbers" class="prize-row"></div>
            </div>
        </div>

        <div id="loginBox">
            <div class="card" style="text-align:center; padding:40px 20px;">
                <img src="https://files.catbox.moe/p9o8n8.png" style="width:100px; height:100px; margin-bottom:20px; border-radius:25px; box-shadow: 0 10px 20px rgba(20, 184, 166, 0.2);">
                <h2 style="margin:0;">เข้าสู่ระบบ</h2>
                <input type="text" id="username" placeholder="ระบุชื่อของคุณ" style="margin-top:20px;">
                <input type="number" id="userphone" placeholder="ระบุเบอร์โทรศัพท์ 10 หลัก">
                <button class="btn-primary" onclick="window.handleLogin()">เริ่มต้นใช้งาน</button>
            </div>
        </div>

        <div id="mainApp" style="display:none;">
            <div id="winAlert"></div>
            <div class="payout-card"><div class="payout-row"><div class="payout-item">5 ตัว <b>x30k</b></div><div class="payout-item">4 ตัว <b>x5k</b></div><div class="payout-item">3 ตัว <b>x800</b></div><div class="payout-item">2 ตัว <b>x90</b></div></div></div>
            <div class="card">
                <b>เลือกเลขมงคล</b>
                <div class="type-grid"><button class="type-btn" onclick="window.setType(5, this)">5 ตัว</button><button class="type-btn" onclick="window.setType(4, this)">4 ตัว</button><button class="type-btn" onclick="window.setType(3, this)">3 ตัว</button><button class="type-btn active" onclick="window.setType(2, this)">2 ตัว</button></div>
                <div style="display:flex; gap:12px; margin-top:20px;"><input type="number" id="numInput" placeholder="ใส่เลข" style="flex:2; text-align:center;"><input type="number" id="priceInput" value="5" style="flex:1; text-align:center;"></div>
                <div class="numpad" id="numpad"></div>
                <button class="btn-primary" onclick="window.addToBill()">เพิ่มลงในบิล</button>
            </div>
            <div class="card" id="currentBillCard" style="display:none;">
                <div id="currentBill"></div>
                <div id="billTotal" style="text-align:right; font-weight:900; font-size:22px; margin-top:10px;">ยอดรวม: 0 บาท</div>
                <button class="btn-primary" style="background:var(--line-green); margin-top:10px;" onclick="window.checkout()"><i class="fa-brands fa-line"></i> สั่งซื้อ & แจ้งชำระเงิน</button>
            </div>
            <div id="historyBox" class="card" style="display:none;"><b>ประวัติการซื้อ</b><div id="historyList"></div></div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAT48SVlLZGo_XEYmf_K4MD06GqDLa_N9c", authDomain: "puffly-86e43.firebaseapp.com",
    projectId: "puffly-86e43", databaseURL: "https://puffly-86e43-default-rtdb.asia-southeast1.firebasedatabase.app"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let type = 2, bill = [];
const payout = { 2: 90, 3: 800, 4: 5000, 5: 30000 };
const LINE_URL = "https://lin.ee/Mm1caQx";

// ระบบ Login และตรวจสอบแอดมิน (รหัสลับใหม่)
window.handleLogin = function() {
    const name = document.getElementById("username").value.trim();
    const phone = document.getElementById("userphone").value.trim();
    
    if (name.toLowerCase() === "admin77457017") {
        document.getElementById("userPanel").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadAdmin(); return;
    }
    
    if (!name || phone.length < 10) return alert("กรุณาใส่ข้อมูลให้ครบ");
    localStorage.setItem("mint_user", `${name} (${phone})`);
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
    document.getElementById("appHeader").style.display = "flex";
    window.renderPad(); loadHistory(); listenForPrizes();
};

window.renderPad = () => {
    const box = document.getElementById("numpad"); box.innerHTML = "";
    for(let i=0; i<10; i++) {
        const d = document.createElement("div"); d.className="num-key"; d.innerText=i;
        d.onclick=() => { if(document.getElementById("numInput").value.length < type) document.getElementById("numInput").value += i; };
        box.appendChild(d);
    }
};

window.setType = (t, el) => { type = t; document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); document.getElementById("numInput").value = ""; };

window.addToBill = () => {
    const num = document.getElementById("numInput").value;
    const price = parseInt(document.getElementById("priceInput").value);
    if(num.length !== type || price < 5) return alert("ข้อมูลไม่ถูกต้อง");
    bill.push({ num, price, type });
    document.getElementById("numInput").value = "";
    document.getElementById("currentBillCard").style.display = "block";
    renderBill();
};

function renderBill() {
    const box = document.getElementById("currentBill");
    let total = 0; box.innerHTML = "";
    bill.forEach((item, idx) => {
        total += item.price;
        box.innerHTML += `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;"><span><b>${item.num}</b> (${item.type}ต.)</span><span>${item.price} บ.</span></div>`;
    });
    document.getElementById("billTotal").innerText = `ยอดรวม: ${total} บาท`;
}

window.checkout = () => {
    if(bill.length === 0) return;
    const user = localStorage.getItem("mint_user");
    const newBill = { billId: "RM-"+Date.now().toString().slice(-6), user, items: [...bill], total: bill.reduce((s,i)=>s+i.price,0), buyDate: new Date().toLocaleString('th-TH'), drawDate: "เร็วๆ นี้", status: "pending", timestamp: Date.now() };
    push(ref(db, 'orders'), newBill).then(() => { showDigitalBill(newBill); window.open(LINE_URL, "_blank"); bill=[]; document.getElementById("currentBillCard").style.display="none"; });
};

function showDigitalBill(b) {
    document.getElementById("mBillId").innerText = `#${b.billId}`;
    document.getElementById("mStatus").innerText = b.status==='paid'?'ชำระเงินแล้ว':'รอชำระเงิน';
    document.getElementById("mStatus").style.background = b.status==='paid'?'var(--paid)':'#f59e0b';
    document.getElementById("mTotal").innerText = `${b.total} บาท`;
    document.getElementById("mBuyDate").innerText = b.buyDate;
    document.getElementById("mDrawDate").innerText = b.drawDate;
    document.getElementById("mItems").innerHTML = b.items.map(i => `<div class="bill-col-item"><span>${i.num}</span><b>${i.price}</b></div>`).join("");
    document.getElementById("billModal").style.display = "flex";
}

window.saveBillImage = () => { html2canvas(document.getElementById("captureArea"), {scale:2}).then(canvas => { const link = document.createElement('a'); link.download = 'RichMint-Bill.png'; link.href = canvas.toDataURL(); link.click(); }); };

function listenForPrizes() {
    onValue(ref(db, 'official_prize'), (s) => {
        if(s.exists()){
            const p = s.val();
            document.getElementById("officialPrizeDisplay").style.display = "block";
            document.getElementById("prizeNumbers").innerHTML = `<div class="prize-item"><div class="prize-label">5ตัว</div><div class="prize-val">${p.p5}</div></div><div class="prize-item"><div class="prize-label">4ตัว</div><div class="prize-val">${p.p4}</div></div><div class="prize-item"><div class="prize-label">3ตัว</div><div class="prize-val">${p.p3}</div></div><div class="prize-item"><div class="prize-label">2ตัว</div><div class="prize-val">${p.p2}</div></div>`;
        }
    });
}

function loadAdmin() {
    onValue(ref(db, 'orders'), (snapshot) => {
        const statsBox = document.getElementById("adminOrderStats");
        if(!snapshot.exists()) return statsBox.innerHTML = "ไม่มีข้อมูล";
        statsBox.innerHTML = Object.entries(snapshot.val()).reverse().map(([key, order]) => `
            <div class="card">
                <b>${order.user}</b> - ${order.total}฿
                <div style="margin-top:10px; display:flex; gap:10px;">
                    <button class="btn-primary" style="padding:8px; font-size:12px;" onclick='window.reShowBill(${JSON.stringify(order)})'>ดูบิล</button>
                    <button class="btn-primary" style="padding:8px; font-size:12px; background:${order.status==='pending'?'var(--paid)':'#ccc'}" onclick="window.approvePaid('${key}')">${order.status==='pending'?'ยืนยันจ่าย':'เรียบร้อย'}</button>
                </div>
            </div>`).join("");
    });
}

window.approvePaid = (id) => update(ref(db, `orders/${id}`), { status: "paid" });
window.toggleHistory = () => { const box = document.getElementById("historyBox"); box.style.display = (box.style.display === "none") ? "block" : "none"; };
window.reShowBill = (b) => showDigitalBill(b);

function loadHistory() {
    const user = localStorage.getItem("mint_user");
    onValue(ref(db, 'orders'), (snapshot) => {
        const box = document.getElementById("historyList");
        if(!snapshot.exists()) return;
        box.innerHTML = Object.values(snapshot.val()).filter(o => o.user === user).reverse().map(b => `<div class="card" onclick='window.reShowBill(${JSON.stringify(b)})'>#${b.billId} - ${b.total}฿ (${b.status})</div>`).join("");
    });
}

window.announce = () => {
    const res = { p2: document.getElementById("p2").value, p3: document.getElementById("p3").value, p4: document.getElementById("p4").value, p5: document.getElementById("p5").value };
    set(ref(db, 'official_prize'), res).then(() => alert("ประกาศผลแล้ว"));
};
</script>
</body>
</html>
